# Server block de Nginx para Arka01 — Laravel + WebSocket de Reverb.
#
# Instalación (por SSH, en el servidor, después de clonar el repo en
# /var/www/arka01 — ver deploy/README.md):
#   sudo ln -s /var/www/arka01/deploy/nginx-arka01.conf /etc/nginx/sites-available/arka01.conf
#   sudo ln -s /etc/nginx/sites-available/arka01.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d arka01.com -d www.arka01.com
#
# Certbot edita este mismo archivo para agregar el bloque 443 (HTTPS) y el
# redirect 80→443 — no hace falta tocarlo de nuevo después de eso.

server {
    listen 80;
    listen [::]:80;
    server_name arka01.com www.arka01.com;
    root /var/www/arka01/public;

    index index.php;

    # Subida de archivos (pedido explícito del usuario): hasta 6 fotos de
    # 4MB en Viajes VAN + comprobante de pago de 5MB — 32M cubre el caso
    # peor con margen.
    client_max_body_size 32M;

    add_header X-Content-Type-Options "nosniff" always;
    # El resto de los headers de seguridad (CSP, HSTS, etc.) ya los pone
    # App\Http\Middleware\SecurityHeaders desde el propio Laravel — no hace
    # falta duplicarlos acá.

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # `include fastcgi_params;` NO manda ninguna señal de HTTPS — acá se
        # habla directo con PHP-FPM por fastcgi_pass (no hay proxy_pass de
        # por medio como sí tiene el bloque de Reverb, más abajo), así que
        # sin esto Laravel/TrustProxies nunca se entera de que el navegador
        # está en https:// de verdad y trata cada request como HTTP plano.
        # `$https` es una variable propia de Nginx (vacía en este bloque de
        # `listen 80`, "on" en el bloque `listen 443 ssl` que agrega
        # Certbot) — Certbot copia este location tal cual al bloque 443, así
        # que ahí queda correcto solo, sin tener que tocarlo a mano después.
        fastcgi_param HTTPS $https;
    }

    # Reverb (WebSockets "en vivo": ubicación del conductor, estado de
    # carrera) — el navegador se conecta acá por WSS (REVERB_HOST/PORT/SCHEME
    # en .env), y esto lo reenvía al proceso real de Reverb, que escucha
    # SOLO en localhost:8080 (REVERB_SERVER_HOST/PORT) — nunca expuesto
    # directo. `/app/...` es el WebSocket del cliente, `/apps/...` es la API
    # REST que el propio backend de Laravel usa para publicar eventos.
    location ~ ^/(app|apps)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Conexiones WebSocket de larga duración — sin esto, Nginx las corta
        # a los 60s por defecto y "en vivo" se desconecta solo cada rato.
        proxy_read_timeout 86400;
    }

    # Radio Push-to-Talk (radio-server/, WALKIE_TALKIE_WEB.md) — mismo patrón
    # que Reverb arriba: el navegador se conecta por WSS al MISMO dominio
    # (VITE_RADIO_URL=https://arka01.com, VITE_RADIO_SOCKET_PATH=/radio/socket.io
    # en .env) y esto lo reenvía al proceso Node real, que escucha SOLO en
    # localhost:3000 con su propio SOCKET_PATH=/socket.io interno — de ahí la
    # barra final en proxy_pass, que reescribe el prefijo /radio/socket.io al
    # /socket.io que Node espera. Sin este bloque, VITE_RADIO_URL termina
    # apuntando directo al puerto 3000 por HTTP plano, lo que el navegador
    # bloquea como contenido mixto en cuanto el sitio corre por HTTPS.
    location /radio/socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Nunca servir dotfiles (.env, .git, etc.) ni nada fuera de lo que
    # Laravel expone a propósito.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
