# Server block de Nginx para Arka01 — Laravel + WebSocket de Reverb.
#
# Instalación (por SSH, en el servidor, después de clonar el repo en
# /var/www/arka01 — ver deploy/README.md):
#   sudo ln -s /var/www/arka01/deploy/nginx-arka01.conf /etc/nginx/sites-available/arka01.conf
#   sudo ln -s /etc/nginx/sites-available/arka01.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d arka01.com -d www.arka01.com
#
# Certbot edita este mismo archivo para agregar el bloque 443 (HTTPS) y el
# redirect 80→443 — no hace falta tocarlo de nuevo después de eso.

server {
    listen 80;
    listen [::]:80;
    server_name arka01.com www.arka01.com;
    root /var/www/arka01/public;

    index index.php;

    # Subida de archivos (pedido explícito del usuario): hasta 6 fotos de
    # 4MB en Viajes VAN + comprobante de pago de 5MB — 32M cubre el caso
    # peor con margen.
    client_max_body_size 32M;

    add_header X-Content-Type-Options "nosniff" always;
    # El resto de los headers de seguridad (CSP, HSTS, etc.) ya los pone
    # App\Http\Middleware\SecurityHeaders desde el propio Laravel — no hace
    # falta duplicarlos acá.

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Reverb (WebSockets "en vivo": ubicación del conductor, estado de
    # carrera) — el navegador se conecta acá por WSS (REVERB_HOST/PORT/SCHEME
    # en .env), y esto lo reenvía al proceso real de Reverb, que escucha
    # SOLO en localhost:8080 (REVERB_SERVER_HOST/PORT) — nunca expuesto
    # directo. `/app/...` es el WebSocket del cliente, `/apps/...` es la API
    # REST que el propio backend de Laravel usa para publicar eventos.
    location ~ ^/(app|apps)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Conexiones WebSocket de larga duración — sin esto, Nginx las corta
        # a los 60s por defecto y "en vivo" se desconecta solo cada rato.
        proxy_read_timeout 86400;
    }

    # Nunca servir dotfiles (.env, .git, etc.) ni nada fuera de lo que
    # Laravel expone a propósito.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
