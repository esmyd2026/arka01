; Mantiene vivo el servidor de WebSockets (Laravel Reverb) de Arka01 en
; producción — sin esto, "en vivo" (ubicación del conductor, estado de la
; carrera, chat) deja de actualizarse solo apenas el proceso se cae, aunque
; el resto de la app siga funcionando normal por HTTP.
;
; Instalación: mismos pasos que supervisor-queue-worker.conf — copiar a
; /etc/supervisor/conf.d/arka01-reverb.conf, ajustar la ruta y el usuario,
; `supervisorctl reread && update && start arka01-reverb:*`.
;
; Reverb tiene que estar escuchando en el puerto configurado en
; REVERB_SERVER_PORT (.env) — si el servidor tiene firewall, ese puerto
; necesita estar abierto (o, más común, detrás de un proxy Nginx que lo
; exponga por HTTPS/WSS en el puerto 443 — ver la documentación de Reverb
; para el bloque de Nginx recomendado).

[program:arka01-reverb]
process_name=%(program_name)s
directory=/var/www/arka01
command=php artisan reverb:start
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/arka01/storage/logs/reverb.log
stopwaitsecs=30
