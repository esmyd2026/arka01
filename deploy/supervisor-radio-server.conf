; Mantiene vivo el repetidor de audio Push-to-Talk (radio-server/,
; WALKIE_TALKIE_WEB.md) de Arka01 en producción — sin esto, el botón "Activar
; radio" queda con el error "No se pudo cargar el servicio de radio." /
; "No se pudo conectar con la radio." apenas el proceso se cae, aunque el
; resto de la app siga funcionando normal por HTTP.
;
; Instalación: mismos pasos que supervisor-reverb.conf — copiar a
; /etc/supervisor/conf.d/arka01-radio-server.conf, ajustar la ruta y el
; usuario, `supervisorctl reread && update && start arka01-radio-server:*`.
;
; radio-server/ necesita su PROPIO .env (nunca el de Laravel) con, como
; mínimo: HOST=127.0.0.1, PORT=3000, SOCKET_PATH=/socket.io,
; RADIO_SHARED_SECRET (idéntico al de Laravel .env),
; APP_ORIGINS=https://arka01.com,https://www.arka01.com — ver
; radio-server/.env.example. El proceso escucha SOLO en localhost:3000;
; Nginx lo expone por HTTPS/WSS en /radio/socket.io/ (ver
; deploy/nginx-arka01.conf), nunca directo.

[program:arka01-radio-server]
process_name=%(program_name)s
directory=/var/www/arka01/radio-server
command=npm start
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/arka01/storage/logs/radio-server.log
stopwaitsecs=30
