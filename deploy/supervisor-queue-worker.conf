; Mantiene vivo el worker de colas de Arka01 en producción (gap identificado
; antes del despliegue: hoy corre a mano con `php artisan queue:work`, y si
; se cae — un error, un reinicio del servidor — nadie manda las carreras
; nuevas, los avisos de WhatsApp ni el resto de los Jobs hasta que alguien lo
; note y lo vuelva a arrancar a mano).
;
; Instalación (Ubuntu/Debian con Supervisor, `apt install supervisor`):
;   1. Copiar este archivo a /etc/supervisor/conf.d/arka01-queue-worker.conf
;   2. Reemplazar /var/www/arka01 por la ruta real del proyecto en el
;      servidor, y `www-data` por el usuario con el que corre la app.
;   3. sudo supervisorctl reread && sudo supervisorctl update
;   4. sudo supervisorctl start arka01-queue-worker:*
;
; Con QUEUE_CONNECTION=database (el que ya usa Arka01), no hace falta nada
; más — no depende de Redis ni de ningún otro servicio extra.

[program:arka01-queue-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/arka01
command=php artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Dos workers en paralelo alcanza para el volumen del piloto (sección 11.2
; del alcance) — subir este número si en algún momento los Jobs se acumulan
; más rápido de lo que se procesan.
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/arka01/storage/logs/queue-worker.log
stopwaitsecs=3600
